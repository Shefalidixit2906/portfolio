<div class="mdc-card">
  <div class="mdc-card__content app-card__content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2 class="mdc-typography--headline6" style="margin: 0;">All Pending Tasks</h2>
      
      <!-- Send Reminders Button -->
      <button id="send-reminders-button" class="mdc-button mdc-button--raised" style="display:none;">
        <span class="mdc-button__ripple"></span>
        <i class="material-icons mdc-button__icon" aria-hidden="true">send</i>
        <span class="mdc-button__label">Send Reminders</span>
      </button>
    </div>
    
    <!-- Search Fields -->
    <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
      <!-- Name Search -->
      <div style="flex: 1; min-width: 250px;">
        <div class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-leading-icon" style="width: 100%;">
          <i class="material-icons mdc-text-field__icon mdc-text-field__icon--leading">person_search</i>
          <input type="text" id="searchName" class="mdc-text-field__input" aria-labelledby="name-search-label">
          <div class="mdc-notched-outline">
            <div class="mdc-notched-outline__leading"></div>
            <div class="mdc-notched-outline__notch">
              <span class="mdc-floating-label" id="name-search-label">Search by name</span>
            </div>
            <div class="mdc-notched-outline__trailing"></div>
          </div>
        </div>
      </div>
      
      <!-- Task Search -->
      <div style="flex: 1; min-width: 250px;">
        <div class="mdc-text-field mdc-text-field--outlined mdc-text-field--with-leading-icon" style="width: 100%;">
          <i class="material-icons mdc-text-field__icon mdc-text-field__icon--leading">search</i>
          <input type="text" id="searchTask" class="mdc-text-field__input" aria-labelledby="task-search-label">
          <div class="mdc-notched-outline">
            <div class="mdc-notched-outline__leading"></div>
            <div class="mdc-notched-outline__notch">
              <span class="mdc-floating-label" id="task-search-label">Search by task</span>
            </div>
            <div class="mdc-notched-outline__trailing"></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Tasks Table -->
    <div class="mdc-data-table" style="width: 100%;">
      <div class="mdc-data-table__table-container">
        <table class="mdc-data-table__table">
          <thead>
            <tr class="mdc-data-table__header-row">
              <th class="mdc-data-table__header-cell mdc-data-table__header-cell--numeric taskID" role="columnheader" scope="col" style="display:none;">ID</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Name</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Number</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Task</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Planned Date</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Mark Complete</th>
              <th class="mdc-data-table__header-cell" role="columnheader" scope="col">Revise</th>
            </tr>
          </thead>
          <tbody id="searchResults" class="mdc-data-table__content">
            <!-- Results will be populated here -->
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- No Results Message -->
    <div id="no-results-message" class="mdc-typography--body1 invisible" style="text-align: center; padding: 24px; color: var(--mdc-theme-primary);">
      <i class="material-icons" style="font-size: 48px; display: block; margin: 0 auto 16px;">check_circle_outline</i>
      No Tasks Pending
    </div>
  </div>
</div>

<!-- Task Row Template -->
<template id="rowTemplate">
  <tr class="mdc-data-table__row">
    <td class="mdc-data-table__cell mdc-data-table__cell--numeric taskID"></td>
    <td class="mdc-data-table__cell doerName"></td>
    <td class="mdc-data-table__cell number"></td>
    <td class="mdc-data-table__cell task"></td>
    <td class="mdc-data-table__cell planned_date"></td>
    <td class="mdc-data-table__cell">
      <div class="button-container">
        <button class="mdc-button mdc-button--outlined done-button" data-button-state="done">
          <span class="mdc-button__ripple"></span>
          <i class="material-icons mdc-button__icon">check</i>
          <span class="mdc-button__label">Done</span>
        </button>
        <button class="mdc-button mdc-button--outlined confirm-button2 mdc-theme--error d-none">
          <span class="mdc-button__ripple"></span>
          <i class="material-icons mdc-button__icon">check_circle</i>
          <span class="mdc-button__label">Confirm</span>
        </button>
      </div>
    </td>
    <td class="mdc-data-table__cell">
      <button class="mdc-button mdc-button--outlined revise-button">
        <span class="mdc-button__ripple"></span>
        <i class="material-icons mdc-button__icon">update</i>
        <span class="mdc-button__label">Revise</span>
      </button>
    </td>
  </tr>
</template>

<style>
.d-none {
  display: none !important;
}
.invisible {
  visibility: hidden !important;
}
.button-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mdc-data-table {
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(0, 0, 0, 0.12);
}
/* Add borders to table cells */
.mdc-data-table__cell {
  border-right: 1px solid rgba(0, 0, 0, 0.08);
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}
.mdc-data-table__header-cell {
  border-right: 1px solid rgba(0, 0, 0, 0.08);
  border-bottom: 2px solid rgba(0, 0, 0, 0.12);
}
/* Hide taskID cells */
.taskID {
  display: none !important;
}
/* Task cell word wrapping */
.task {
  white-space: normal;
  word-wrap: break-word;
  max-width: 250px;
}
/* Responsive adjustments */
@media (max-width: 768px) {
  .mdc-data-table__header-cell, 
  .mdc-data-table__cell {
    padding: 0 8px 0 8px;
  }
  .mdc-button__label {
    display: none;
  }
  .mdc-button {
    min-width: 40px;
    padding: 0 8px;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Initialize Material Components
  const textFields = document.querySelectorAll('.mdc-text-field');
  textFields.forEach(textField => new mdc.textField.MDCTextField(textField));
  
  const buttons = document.querySelectorAll('.mdc-button:not(.d-none)');
  buttons.forEach(button => new mdc.ripple.MDCRipple(button));
  
  // Set up search functionality
  const nameSearch = document.getElementById('searchName');
  const taskSearch = document.getElementById('searchTask');
  
  function filterResults() {
    const nameFilter = nameSearch.value.toLowerCase();
    const taskFilter = taskSearch.value.toLowerCase();
    
    const rows = document.querySelectorAll('#searchResults tr');
    let visibleCount = 0;
    
    rows.forEach(row => {
      const name = row.querySelector('.doerName').textContent.toLowerCase();
      const task = row.querySelector('.task').textContent.toLowerCase();
      
      if (name.includes(nameFilter) && task.includes(taskFilter)) {
        row.style.display = '';
        visibleCount++;
      } else {
        row.style.display = 'none';
      }
    });
    
    // Show/hide no results message
    document.getElementById('no-results-message').classList.toggle('invisible', visibleCount > 0);
  }
  
  nameSearch.addEventListener('input', filterResults);
  taskSearch.addEventListener('input', filterResults);
  
  // Handle the "Done" button click
  document.addEventListener('click', function(e) {
    if (e.target.closest('.done-button')) {
      const button = e.target.closest('.done-button');
      const row = button.closest('tr');
      const confirmButton = row.querySelector('.confirm-button2');
      
      button.classList.add('d-none');
      confirmButton.classList.remove('d-none');
      new mdc.ripple.MDCRipple(confirmButton);
    }
    
    if (e.target.closest('.confirm-button2')) {
      const button = e.target.closest('.confirm-button2');
      const row = button.closest('tr');
      const taskId = row.querySelector('.taskID').textContent;
      
      loadingStart();
      
      google.script.run
        .withSuccessHandler(function() {
          row.remove();
          loadingEnd();
          
          // Show no results message if no more rows
          const remainingRows = document.querySelectorAll('#searchResults tr:not([style*="display: none"])');
          if (remainingRows.length === 0) {
            document.getElementById('no-results-message').classList.remove('invisible');
          }
        })
        .withFailureHandler(function(error) {
          loadingEnd();
          console.error(error);
          alert('Error: ' + error.message);
        })
        .taskComplete(taskId);
    }
    
    if (e.target.closest('.revise-button')) {
      const button = e.target.closest('.revise-button');
      const row = button.closest('tr');
      const taskId = row.querySelector('.taskID').textContent;
      
      loadingStart();
      
      google.script.run
        .withSuccessHandler(function(options) {
          loadView({
            func: "loadReviseView",
            params: options
          });
          loadingEnd();
        })
        .withFailureHandler(function(error) {
          loadingEnd();
          console.error(error);
          alert('Error: ' + error.message);
        })
        .getInfoByTaskID(taskId);
    }
  });
});
</script>
