<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company name — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #F0F4F8;
  --bg2:       #E4ECF4;
  --surface:   #FFFFFF;
  --surface2:  #F7FAFC;
  --surface3:  #EDF2F7;
  --border:    #D1DCE8;
  --border2:   #BCC9D8;

  --navy:      #1A3A6B;
  --navy-dim:  rgba(26,58,107,0.08);
  --blue:      #2563EB;
  --teal:      #0D9488;
  --violet:    #7C3AED;
  --rose:      #E11D48;
  --amber:     #D97706;
  --green:     #059669;
  --orange:    #EA580C;
  --red:       #DC2626;
  --sky:       #0284C7;

  --text:      #1A2332;
  --text2:     #4A5568;
  --text3:     #94A3B8;
  --text4:     #CBD5E0;

  --radius:    12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow:    0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 28px rgba(0,0,0,.10), 0 4px 10px rgba(0,0,0,.06);

  --c-accent: var(--navy);
}

html, body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  min-height: 100vh;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--surface3); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

.header {
  position: sticky; top: 0; z-index: 200;
  background: var(--navy);
  padding: 0 28px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(26,58,107,0.3);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #F59E0B, #D97706);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 700; color: var(--navy);
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.brand-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.brand-sub { font-size: 10px; color: rgba(255,255,255,.55); font-weight: 400; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }

.pill-live {
  display: flex; align-items: center; gap: 5px;
  background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.35);
  border-radius: 99px; padding: 4px 10px; font-size: 11px; color: #6EE7B7; font-weight: 600;
}
.dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: #10B981; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

.btn-refresh {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  border-radius: var(--radius-sm); color: #fff; padding: 7px 14px;
  font-size: 12px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif;
  cursor: pointer; transition: background .2s;
}
.btn-refresh:hover { background: rgba(255,255,255,.2); }
.btn-refresh svg { transition: transform .4s; }
.btn-refresh.loading svg { animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.last-sync { font-size: 10px; color: rgba(255,255,255,.5); margin-right: 4px; }

.nav-wrap {
  background: var(--surface); border-bottom: 2px solid var(--border);
  padding: 0 28px; display: flex; gap: 0; overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
.nav-tab {
  padding: 12px 18px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--text3);
  white-space: nowrap; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: color .2s, border-color .2s;
  display: flex; align-items: center; gap: 6px;
}
.nav-tab:hover { color: var(--text2); }
.nav-tab.active { color: var(--navy); border-bottom-color: var(--navy); }

.main { padding: 22px 28px; }

.loading-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 360px; gap: 16px;
}
.spinner-ring {
  width: 44px; height: 44px;
  border: 3px solid var(--border); border-top-color: var(--navy);
  border-radius: 50%; animation: spin .8s linear infinite;
}
.loading-text { color: var(--text3); font-size: 13px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px 14px;
  position: relative; overflow: hidden;
  transition: transform .2s, box-shadow .2s; box-shadow: var(--shadow-sm);
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--c-accent); border-radius: var(--radius) var(--radius) 0 0;
}
.kpi-icon {
  font-size: 22px; margin-bottom: 10px; line-height: 1;
  width: 40px; height: 40px; background: var(--navy-dim);
  border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
}
.kpi-value { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
.kpi-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }

.inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.inv-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  position: relative; overflow: hidden; box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 14px;
  transition: transform .2s, box-shadow .2s;
}
.inv-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.inv-icon { width: 48px; height: 48px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.inv-val { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; line-height: 1; }
.inv-lbl { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
.inv-avail .inv-icon { background: rgba(5,150,105,.1);  color: var(--green); }
.inv-avail .inv-val  { color: var(--green); }
.inv-out   .inv-icon { background: rgba(220,38,38,.1);  color: var(--red); }
.inv-out   .inv-val  { color: var(--red); }
.inv-low   .inv-icon { background: rgba(217,119,6,.1);  color: var(--amber); }
.inv-low   .inv-val  { color: var(--amber); }
.inv-over  .inv-icon { background: rgba(234,88,12,.1);  color: var(--orange); }
.inv-over  .inv-val  { color: var(--orange); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.panel + .panel { margin-top: 14px; }

.section-title {
  font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; color: var(--text);
}
.section-title::before {
  content: ''; display: inline-block; width: 3px; height: 16px;
  background: var(--navy); border-radius: 2px; flex-shrink: 0;
}
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.section-title-row .section-title { margin-bottom: 0; }

.g2  { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.g3  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }

.stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-chip {
  flex: 1; min-width: 110px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; text-align: center; box-shadow: var(--shadow-sm);
}
.stat-val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; line-height: 1.1; color: var(--text); }
.stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .7px; margin-top: 4px; }

.prog { margin-bottom: 11px; }
.prog-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.prog-name { font-size: 12px; color: var(--text2); font-weight: 500; }
.prog-num  { font-family: 'Fraunces', serif; font-size: 12px; font-weight: 700; color: var(--navy); }
.prog-track { height: 6px; background: var(--surface3); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.prog-fill  { height: 100%; border-radius: 99px; transition: width 1.1s cubic-bezier(.22,.68,0,1.2); }

.tbl-wrap { overflow-x: auto; overflow-y: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.tbl-wrap.maxh { max-height: 460px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
thead th {
  background: var(--navy); color: rgba(255,255,255,.85); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; padding: 10px 12px; text-align: left;
  position: sticky; top: 0; z-index: 2; white-space: nowrap; vertical-align: middle;
}
thead th.r { text-align: right; }
tbody td {
  padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text);
  white-space: nowrap; vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg2); }
tbody tr:nth-child(even) td { background: var(--surface2); }
tbody tr:nth-child(even):hover td { background: var(--bg2); }
td.r { text-align: right; font-weight: 600; font-family: 'Fraunces', serif; min-width: 56px; }
td.navy  { color: var(--navy)  !important; }
td.teal  { color: var(--teal)  !important; }
td.green { color: var(--green) !important; }
td.muted { color: var(--text3) !important; font-size: 11px; }
td.red   { color: var(--red)   !important; }
td.amber { color: var(--amber) !important; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; white-space: nowrap;
}
.b-warn   { background: rgba(217,119,6,.12);  color: var(--amber);  border: 1px solid rgba(217,119,6,.25); }
.b-red    { background: rgba(220,38,38,.12);  color: var(--red);    border: 1px solid rgba(220,38,38,.25); }
.b-green  { background: rgba(5,150,105,.12);  color: var(--green);  border: 1px solid rgba(5,150,105,.25); }
.b-teal   { background: rgba(13,148,136,.12); color: var(--teal);   border: 1px solid rgba(13,148,136,.25); }
.b-navy   { background: rgba(26,58,107,.12);  color: var(--navy);   border: 1px solid rgba(26,58,107,.25); }
.b-orange { background: rgba(234,88,12,.12);  color: var(--orange); border: 1px solid rgba(234,88,12,.25); }

.alert {
  display: flex; align-items: center; gap: 10px;
  border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px;
  font-size: 12px; font-weight: 600;
}
.alert-danger { background: rgba(220,38,38,.08); border: 1px solid rgba(220,38,38,.25); color: var(--red); }
.alert-warn   { background: rgba(217,119,6,.08); border: 1px solid rgba(217,119,6,.25); color: var(--amber); }
.alert-orange { background: rgba(234,88,12,.08); border: 1px solid rgba(234,88,12,.25); color: var(--orange); }

.search-bar {
  width: 100%; max-width: 420px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
  color: var(--text); font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif;
  outline: none; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  transition: border-color .2s, box-shadow .2s;
}
.search-bar:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,58,107,.12); }
.search-bar::placeholder { color: var(--text3); }

.toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar-row .search-bar { margin-bottom: 0; flex: 1; min-width: 220px; }

.sort-select {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
  color: var(--text2); font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif;
  outline: none; box-shadow: var(--shadow-sm); cursor: pointer; font-weight: 600;
}
.sort-select:focus { border-color: var(--navy); }

/* ── FOCUS FILTER (multi-select dropdown) ─────────────────── */
.filter-bar { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-group { position: relative; }
.filter-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
  color: var(--text2); font-size: 12px; font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer;
  box-shadow: var(--shadow-sm); min-width: 150px; justify-content: space-between;
}
.filter-btn:hover { border-color: var(--border2); }
.filter-btn.has-selection { border-color: var(--navy); color: var(--navy); background: var(--navy-dim); }
.filter-count {
  background: var(--navy); color: #fff; border-radius: 99px;
  font-size: 9px; font-weight: 700; padding: 1px 6px; margin-left: 4px;
}
.filter-caret { font-size: 9px; color: var(--text3); transition: transform .15s; }
.filter-group.open .filter-caret { transform: rotate(180deg); }
.filter-panel {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); min-width: 230px; max-width: 320px;
  padding: 8px; max-height: 320px; overflow-y: auto;
}
.filter-group.open .filter-panel { display: block; }
.filter-search {
  width: 100%; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; font-size: 11px; margin-bottom: 6px; outline: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.filter-search:focus { border-color: var(--navy); }
.filter-opt {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
  color: var(--text2);
}
.filter-opt:hover { background: var(--bg2); }
.filter-opt input { accent-color: var(--navy); cursor: pointer; }
.filter-opt-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-opt-count { color: var(--text3); font-size: 10px; }
.filter-actions {
  display: flex; justify-content: space-between; gap: 6px;
  padding: 6px 4px 2px; margin-top: 4px; border-top: 1px solid var(--border);
}
.filter-actions button {
  border: none; background: none; color: var(--navy); font-size: 11px;
  font-weight: 700; cursor: pointer; padding: 4px 6px;
}
.filter-actions button:hover { text-decoration: underline; }
.filter-clear-all {
  display: flex; align-items: center; gap: 5px;
  background: rgba(220,38,38,.08); border: 1px solid rgba(220,38,38,.25);
  color: var(--red); border-radius: var(--radius-sm); padding: 8px 12px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.filter-clear-all:hover { background: rgba(220,38,38,.14); }
.filter-summary { font-size: 11px; color: var(--text3); padding: 8px 2px 0; width: 100%; }

@media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .inv-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 960px)  { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .g2,.g3 { grid-template-columns: 1fr; } .main { padding: 14px; } .header { padding: 0 14px; } .nav-wrap { padding: 0 14px; } }
@media (max-width: 560px)  { .kpi-grid { grid-template-columns: 1fr 1fr; } .inv-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo">N</div>
    <div>
      <div class="brand-name">Company name</div>
      <div class="brand-sub">Order Management Dashboard — Manager View</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-sync" id="lastSync"></span>
    <div class="pill-live"><div class="dot-pulse"></div> Live Data</div>
    <button class="btn-refresh" id="refreshBtn" onclick="loadData(true)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Refresh
    </button>
  </div>
</header>

<nav class="nav-wrap" id="navWrap">
  <div class="nav-tab active" onclick="switchTab('overview')">📊 Overview</div>
  <div class="nav-tab" onclick="switchTab('dealers')">🏪 Dealers</div>
  <div class="nav-tab" onclick="switchTab('orders')">📋 Orders</div>
  <div class="nav-tab" onclick="switchTab('production inventory')">📦 Production Inventory</div>
  <div class="nav-tab" onclick="switchTab('team')">👥 Team</div>
  <div class="nav-tab" onclick="switchTab('suppliers')">🏭 Suppliers</div>
  <div class="nav-tab" onclick="switchTab('focus')">🎯 Focus Areas</div>
</nav>

<main class="main" id="main">
  <div class="loading-screen">
    <div class="spinner-ring"></div>
    <div class="loading-text">Loading dashboard data…</div>
  </div>
</main>

<script>
'use strict';

var DATA        = null;
var CURRENT_TAB = 'overview';
var ORDERS_SORT = 'new';

var PALETTE = ['#1A3A6B','#0D9488','#7C3AED','#E11D48','#059669','#D97706','#EA580C','#0284C7','#9333EA','#DC2626','#0891B2','#15803D','#92400E'];

function switchTab(tab) {
  CURRENT_TAB = tab;
  var tabs = ['overview','dealers','orders','production inventory','team','suppliers','focus'];
  document.querySelectorAll('.nav-tab').forEach(function(el, i){
    el.classList.toggle('active', tabs[i] === tab);
  });
  if (DATA) renderTab(tab);
}

function loadData(forceLive) {
  var btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  setMain('<div class="loading-screen"><div class="spinner-ring"></div><div class="loading-text">Fetching live data…</div></div>');
  var call = google.script.run
    .withSuccessHandler(function(d){
      DATA = d;
      btn.classList.remove('loading');
      var now = new Date();
      document.getElementById('lastSync').textContent =
        'Updated ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      renderTab(CURRENT_TAB);
    })
    .withFailureHandler(function(err){
      btn.classList.remove('loading');
      setMain('<div class="loading-screen"><div style="color:var(--red);font-size:14px">⚠️ ' + (err.message || err) + '</div></div>');
    });
  if (forceLive) call.getAllDashboardDataLive();
  else            call.getAllDashboardData();
}

function setMain(html) { document.getElementById('main').innerHTML = html; }

function renderTab(tab) {
  var fn = {
    overview:              renderOverview,
    dealers:               renderDealers,
    orders:                renderOrders,
    'production inventory':renderInventory,
    team:                  renderTeam,
    suppliers:             renderSuppliers,
    focus:                 renderFocus
  }[tab];
  if (fn) fn();
}

function renderOverview() {
  var c  = DATA.cards;
  var sc = DATA.internalOrders.statusCount;
  var html = '';

  var obCount = c.overbookedCount || 0;
  var lowCount = sc['LOW STOCK'] || 0;
  if (obCount > 0)
    html += '<div class="alert alert-orange">🟠 ' + obCount + ' design(s) are OVERBOOKED — review production immediately!</div>';
  if (lowCount > 0)
    html += '<div class="alert alert-danger">🔴 ' + lowCount + ' order(s) have LOW STOCK status — immediate attention required!</div>';

  var fa = DATA.focusAreas || { designs: [], categories: [] };
  if (fa.designs.length > 0) {
    var faIdleTotal = fa.designs.reduce(function(s,d){return s+d.idleValue;},0);
    html += '<div class="alert alert-warn">🎯 ' + fa.designs.length + ' design(s) across ' + fa.categories.length +
      ' categor' + (fa.categories.length===1?'y':'ies') + ' need a sales push — ₹' + fmt(faIdleTotal) +
      ' of stock is sitting unsold. See the 🎯 Focus Areas tab.</div>';
  }

  var kpis = [
    {icon:'🏪', val:fmt(c.totalDealers),             lbl:'Active Dealers',       color:'var(--navy)'},
    {icon:'👔', val:fmt(c.totalPCS),                 lbl:'Total PCS Ordered',     color:'var(--teal)'},
    {icon:'🎨', val:fmt(c.totalDesigns),             lbl:'Total Designs',         color:'var(--violet)'},
    {icon:'📦', val:fmt(c.balanceStock),             lbl:'Balance Stock PCS',     color:'var(--green)'}
  ];
  html += '<div class="kpi-grid">';
  kpis.forEach(function(k){

// ─────────────────────────────────────────────────────────
// ── FOCUS AREAS  (v20 — filter bar added: Category / Supplier /
//    Design No, each a multi-select dropdown. All three combine
//    with AND logic; within one dropdown, selections combine with
//    OR logic. Filters apply to both the design table and its
//    category rollup/stat chips, and are re-applied automatically
//    after every Refresh since render is called fresh each time.)
// ─────────────────────────────────────────────────────────
var FOCUS_FILTERS = { category: [], supplier: [], design: [] };

function focusFilterOptions_(designs, field) {
  var counts = {};
  designs.forEach(function(d){
    var key = field === 'design' ? d.designNo : d[field];
    key = key || '(blank)';
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.keys(counts).sort().map(function(k){ return { value: k, count: counts[k] }; });
}

function focusApplyFilters_(designs) {
  return designs.filter(function(d){
    if (FOCUS_FILTERS.category.length && FOCUS_FILTERS.category.indexOf(d.category || '(blank)') === -1) return false;
    if (FOCUS_FILTERS.supplier.length && FOCUS_FILTERS.supplier.indexOf(d.supplier || '(blank)') === -1) return false;
    if (FOCUS_FILTERS.design.length   && FOCUS_FILTERS.design.indexOf(d.designNo  || '(blank)') === -1) return false;
    return true;
  });
}

function focusRollupCategories_(designs) {
  var catMap = {};
  designs.forEach(function(d) {
    if (!catMap[d.category]) {
      catMap[d.category] = { category: d.category, designCount: 0, totalPcs: 0, totalBooked: 0, totalBalance: 0, totalIdleValue: 0 };
    }
    var c = catMap[d.category];
    c.designCount++;
    c.totalPcs      += d.pcs;
    c.totalBooked   += d.booked;
    c.totalBalance  += d.balance;
    c.totalIdleValue+= d.idleValue;
  });
  return Object.values(catMap).map(function(c) {
    return {
      category:       c.category,
      designCount:    c.designCount,
      totalBalance:   Math.round(c.totalBalance),
      totalIdleValue: Math.round(c.totalIdleValue),
      avgBookingPct:  c.totalPcs > 0 ? Math.round((c.totalBooked / c.totalPcs) * 1000) / 10 : 0
    };
  }).sort(function(a, b) { return b.totalIdleValue - a.totalIdleValue; });
}

function renderFocus() {
  var fa = DATA.focusAreas || { designs: [], categories: [], thresholdPct: 60 };
  var allDesigns = fa.designs || [];

  var filtered   = focusApplyFilters_(allDesigns);
  var categories = focusRollupCategories_(filtered);

  // Category rollup stays sorted by Value Tied Up (biggest first) —
  // but the design-level table below is shown in Design No sequence
  // (e.g. NA-105/1, NA-105/2 … NA-105/10, not alphabetically), so a
  // manager scanning the list can find/verify a design number quickly.
  var designsBySeq = filtered.slice().sort(function(a, b){
    return naturalCompare_(a.designNo, b.designNo);
  });

  var totalIdleValue = filtered.reduce(function(s,d){return s+d.idleValue;},0);
  var totalBalance   = filtered.reduce(function(s,d){return s+d.balance;},0);

  var html = '<div class="stat-row">';
  html += statChip(filtered.length,     'Designs Needing Focus', '');
  html += statChip(categories.length,   'Categories Affected',    'var(--amber)');
  html += statChip(fmt(totalBalance),   'Unsold PCS',             'var(--orange)');
  html += statChip('₹'+fmt(totalIdleValue), 'Value Tied Up',      'var(--red)');
  html += '</div>';

  if (allDesigns.length > 0) {
    html += '<div class="alert alert-warn">🎯 Designs booking below ' + fa.thresholdPct +
      '% of their production and still carrying unsold stock are listed below — these are the styles/categories that need a sales or marketing push.</div>';
  } else {
    html += '<div class="alert alert-warn" style="background:rgba(5,150,105,.08);border-color:rgba(5,150,105,.25);color:var(--green)">✅ No designs currently need a sales push — booking levels look healthy.</div>';
  }

  // ── Filter bar ────────────────────────────────────────────
  html += '<div class="filter-bar" id="focusFilterBar">';
  html += focusFilterGroupHtml_('category', 'Category', focusFilterOptions_(allDesigns, 'category'));
  html += focusFilterGroupHtml_('supplier', 'Supplier', focusFilterOptions_(allDesigns, 'supplier'));
  html += focusFilterGroupHtml_('design',   'Design No', focusFilterOptions_(allDesigns, 'design'));
  var activeCount = FOCUS_FILTERS.category.length + FOCUS_FILTERS.supplier.length + FOCUS_FILTERS.design.length;
  if (activeCount > 0) {
    html += '<div class="filter-clear-all" onclick="focusClearAllFilters()">✕ Clear all filters</div>';
  }
  if (allDesigns.length > 0) {
    html += '<div class="filter-summary">Showing '+filtered.length+' of '+allDesigns.length+' flagged design(s)'+
      (activeCount ? ' matching your filters.' : '.') + '</div>';
  }
  html += '</div>';

  // ── Category rollup ──────────────────────────────────────
  html += '<div class="panel"><div class="section-title-row">'+
    '<div class="section-title">Categories Needing Focus</div>'+
    '<button class="btn-refresh" style="background:var(--navy);color:#fff" onclick="exportFocusCategoriesCSV()">⬇️ Export CSV</button>'+
    '</div>';
  if (categories.length > 0) {
    html += '<div class="tbl-wrap"><table id="focusCatTable"><thead><tr>'+
      '<th>Category</th><th class="r">Designs</th><th class="r">Unsold PCS</th>'+
      '<th class="r">Avg Booking %</th><th class="r">Value Tied Up (₹)</th>'+
      '</tr></thead><tbody>';
    categories.forEach(function(c){
      html += '<tr><td style="font-weight:600">'+esc(c.category)+'</td>'+
        '<td class="r">'+c.designCount+'</td>'+
        '<td class="r amber">'+fmt(c.totalBalance)+'</td>'+
        '<td class="r">'+c.avgBookingPct+'%</td>'+
        '<td class="r red">₹'+fmt(c.totalIdleValue)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<p style="color:var(--text3);font-size:12px;padding:8px 0">Nothing to show for the current filters.</p>';
  }
  html += '</div>';

  // ── Design-level list ─────────────────────────────────────
  html += '<div class="panel" style="margin-top:14px">'+
    '<div class="section-title-row">'+
      '<div class="section-title">Designs Needing Focus</div>'+
      '<button class="btn-refresh" style="background:var(--navy);color:#fff" onclick="exportFocusDesignsCSV()">⬇️ Export CSV</button>'+
    '</div>';
  html += '<input class="search-bar" id="focusSearch" placeholder="🔍  Search design, category, supplier…" oninput="filterTable(\'focusDesignTable\',this.value)">';
  if (designsBySeq.length > 0) {
    html += '<div class="tbl-wrap maxh"><table id="focusDesignTable"><thead><tr>'+
      '<th>Design No</th><th>Category</th><th>Supplier</th>'+
      '<th class="r">Production PCS</th><th class="r">Booked</th><th class="r">Unsold PCS</th>'+
      '<th class="r">Booking %</th><th class="r">MRP</th><th class="r">Value Tied Up (₹)</th>'+
      '</tr></thead><tbody>';
    designsBySeq.forEach(function(d){
      html += '<tr>'+
        '<td style="font-weight:700;color:var(--teal)">'+esc(d.designNo)+'</td>'+
        '<td>'+esc(d.category)+'</td>'+
        '<td class="muted">'+esc(d.supplier)+'</td>'+
        '<td class="r navy">'+fmt(d.pcs)+'</td>'+
        '<td class="r">'+fmt(d.booked)+'</td>'+
        '<td class="r amber">'+fmt(d.balance)+'</td>'+
        '<td class="r" style="color:var(--red)">'+d.bookingPct+'%</td>'+
        '<td class="r muted">₹'+fmt(d.mrp)+'</td>'+
        '<td class="r red">₹'+fmt(d.idleValue)+'</td>'+
        '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<p style="color:var(--text3);font-size:12px;padding:8px 0">No designs match the current filters.</p>';
  }
  html += '</div>';

  setMain(html);
  focusAttachOutsideClickHandler_();
}

// Builds one filter-group dropdown (button + checkbox panel) for
// the given field ('category' | 'supplier' | 'design').
function focusFilterGroupHtml_(field, label, options) {
  var selected = FOCUS_FILTERS[field];
  var hasSel   = selected.length > 0;
  var html = '<div class="filter-group" id="filterGroup_'+field+'">'+
    '<div class="filter-btn'+(hasSel?' has-selection':'')+'" onclick="focusToggleGroup(\''+field+'\')">'+
      '<span>'+label+(hasSel?' <span class="filter-count">'+selected.length+'</span>':'')+'</span>'+
      '<span class="filter-caret">▾</span>'+
    '</div>'+
    '<div class="filter-panel">'+
      '<input class="filter-search" placeholder="Search '+label.toLowerCase()+'…" oninput="focusFilterSearch(this,\''+field+'\')">'+
      '<div class="filter-opt-list">';
  options.forEach(function(opt){
    var checked = selected.indexOf(opt.value) !== -1;
    var safeVal = esc(opt.value).replace(/"/g,'&quot;');
    html += '<label class="filter-opt" data-optval="'+safeVal.toLowerCase()+'">'+
      '<input type="checkbox" '+(checked?'checked':'')+' onchange="focusToggleOption(\''+field+'\', this.dataset.rawval, this.checked)" data-rawval="'+safeVal+'">'+
      '<span class="filter-opt-label">'+esc(opt.value)+'</span>'+
      '<span class="filter-opt-count">'+opt.count+'</span>'+
      '</label>';
  });
  html += '</div>'+
    '<div class="filter-actions">'+
      '<button onclick="focusClearGroup(\''+field+'\')">Clear</button>'+
      '<button onclick="focusCloseGroup(\''+field+'\')">Done</button>'+
    '</div>'+
  '</div></div>';
  return html;
}

function focusToggleGroup(field) {
  var allGroups = document.querySelectorAll('.filter-group');
  allGroups.forEach(function(g){
    if (g.id === 'filterGroup_'+field) g.classList.toggle('open');
    else g.classList.remove('open');
  });
}

function focusCloseGroup(field) {
  var g = document.getElementById('filterGroup_'+field);
  if (g) g.classList.remove('open');
}

function focusToggleOption(field, value, isChecked) {
  var arr = FOCUS_FILTERS[field];
  var idx = arr.indexOf(value);
  if (isChecked && idx === -1) arr.push(value);
  if (!isChecked && idx !== -1) arr.splice(idx, 1);
  renderFocus();
  // Re-open the same group after re-render so multi-selecting
  // several options in a row doesn't require re-opening the panel.
  var g = document.getElementById('filterGroup_'+field);
  if (g) g.classList.add('open');
}

function focusClearGroup(field) {
  FOCUS_FILTERS[field] = [];
  renderFocus();
}

function focusClearAllFilters() {
  FOCUS_FILTERS = { category: [], supplier: [], design: [] };
  renderFocus();
}

function focusFilterSearch(inputEl, field) {
  var q = inputEl.value.toLowerCase();
  var group = document.getElementById('filterGroup_'+field);
  if (!group) return;
  group.querySelectorAll('.filter-opt').forEach(function(opt){
    var val = opt.getAttribute('data-optval') || '';
    opt.style.display = val.indexOf(q) !== -1 ? '' : 'none';
  });
}

// Close any open filter dropdown when clicking elsewhere on the page.
function focusAttachOutsideClickHandler_() {
  document.removeEventListener('click', focusOutsideClickListener_, true);
  document.addEventListener('click', focusOutsideClickListener_, true);
}
function focusOutsideClickListener_(e) {
  var bar = document.getElementById('focusFilterBar');
  if (!bar) return;
  if (!bar.contains(e.target)) {
    document.querySelectorAll('.filter-group.open').forEach(function(g){ g.classList.remove('open'); });
  }
}

function exportToCSV(rows, headers, filename) {
  var lines = [];
  lines.push(headers.map(function(h){ return csvEscape_(h.label); }).join(','));
  rows.forEach(function(row){
    lines.push(headers.map(function(h){ return csvEscape_(row[h.key]); }).join(','));
  });
  var csvContent = lines.join('\r\n');
  var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function csvEscape_(val) {
  val = (val === undefined || val === null) ? '' : String(val);
  if (val.indexOf(',') !== -1 || val.indexOf('"') !== -1 || val.indexOf('\n') !== -1) {
    val = '"' + val.replace(/"/g, '""') + '"';
  }
  return val;
}

function exportFocusDesignsCSV() {
  var allDesigns = (DATA.focusAreas && DATA.focusAreas.designs) || [];
  var designs    = focusApplyFilters_(allDesigns).slice().sort(function(a, b){
    return naturalCompare_(a.designNo, b.designNo);
  });
  var headers = [
    { key:'designNo',   label:'Design No' },
    { key:'category',   label:'Category' },
    { key:'supplier',   label:'Supplier' },
    { key:'pcs',        label:'Production PCS' },
    { key:'booked',     label:'Booked PCS' },
    { key:'balance',    label:'Unsold PCS' },
    { key:'bookingPct', label:'Booking %' },
    { key:'mrp',        label:'MRP' },
    { key:'idleValue',  label:'Value Tied Up (₹)' }
  ];
  var stamp = new Date().toISOString().slice(0,10);
  exportToCSV(designs, headers, 'focus_areas_designs_' + stamp + '.csv');
}

function exportFocusCategoriesCSV() {
  var allDesigns = (DATA.focusAreas && DATA.focusAreas.designs) || [];
  var categories = focusRollupCategories_(focusApplyFilters_(allDesigns));
  var headers = [
    { key:'category',       label:'Category' },
    { key:'designCount',    label:'Designs Needing Focus' },
    { key:'totalBalance',   label:'Unsold PCS' },
    { key:'avgBookingPct',  label:'Avg Booking %' },
    { key:'totalIdleValue', label:'Value Tied Up (₹)' }
  ];
  var stamp = new Date().toISOString().slice(0,10);
  exportToCSV(categories, headers, 'focus_areas_categories_' + stamp + '.csv');
}

function renderSuppliers() {
  var sup   = DATA.suppliers;
  var totP  = sup.reduce(function(s,x){return s+x.production;},0);
  var totB  = sup.reduce(function(s,x){return s+x.booked;},0);
  var totBal= sup.reduce(function(s,x){return s+x.balance;},0);

  var html = '<div class="stat-row">';
  html += statChip(sup.length,              'Suppliers',      '');
  html += statChip(fmt(totP),   'Production PCS', '');
  html += statChip(fmt(totB),        'Booked PCS',     'var(--amber)');
  html += statChip(fmt(totBal), 'Balance PCS',    'var(--green)');
  html += '</div>';

  html += '<div class="panel"><div class="section-title">Supplier Performance</div>'+
    '<div class="tbl-wrap"><table><thead><tr>'+
    '<th>#</th><th>Supplier</th><th class="r">Designs</th>'+
    '<th class="r">Production</th><th class="r">Booked</th>'+
    '<th class="r">Balance</th><th class="r">Utilization</th>'+
    '</tr></thead><tbody>';
  sup.slice().sort(function(a,b){return b.production-a.production;}).forEach(function(s,i){
    var util = s.production ? (s.booked/s.production*100).toFixed(1) : '0.0';
    var uc   = util>80 ? 'var(--red)' : util>50 ? 'var(--amber)' : 'var(--green)';
    html += '<tr>'+
      '<td class="muted">'+(i+1)+'</td>'+
      '<td style="font-weight:600">'+esc(s.name)+'</td>'+
      '<td class="r">'+s.designs+'</td>'+
      '<td class="r navy">'+fmt(s.production)+'</td>'+
      '<td class="r amber">'+fmt(s.booked)+'</td>'+
      '<td class="r green">'+fmt(s.balance)+'</td>'+
      '<td class="r" style="color:'+uc+'">'+util+'%</td>'+
      '</tr>';
  });
  html += '</tbody></table></div></div>';

  html += '<div class="panel" style="margin-top:14px"><div class="section-title">Production Share by Supplier</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 24px">';
  var maxSP = Math.max.apply(null, sup.map(function(s){return s.production;})) || 1;
  sup.forEach(function(s,i){
    html += progBar(esc(s.name), fmt(s.production), s.production/maxSP*100, PALETTE[i%13]);
  });
  html += '</div></div>';

  setMain(html);
}

function fmt(n) {
  n = Number(n) || 0;
  var hasDecimals = Math.abs(n % 1) > 0.001;
  return n.toLocaleString('en-IN', {
    minimumFractionDigits: hasDecimals ? 2 : 0,
    maximumFractionDigits: 2
  });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Natural/sequence sort for design numbers like "NA-105/1",
// "NA-105/2", "NA-105/10" — splits into alternating text/number
// chunks so numeric parts compare by value (2 < 10) instead of
// lexicographically ("10" < "2" as plain strings).
function naturalCompare_(a, b) {
  a = String(a == null ? '' : a);
  b = String(b == null ? '' : b);
  var re = /(\d+)|(\D+)/g;
  var aParts = a.match(re) || [];
  var bParts = b.match(re) || [];
  var len = Math.max(aParts.length, bParts.length);
  for (var i = 0; i < len; i++) {
    var ap = aParts[i] || '';
    var bp = bParts[i] || '';
    if (ap === bp) continue;
    var aNum = /^\d+$/.test(ap), bNum = /^\d+$/.test(bp);
    if (aNum && bNum) {
      var diff = parseInt(ap, 10) - parseInt(bp, 10);
      if (diff !== 0) return diff;
    } else {
      return ap < bp ? -1 : 1;
    }
  }
  return 0;
}

function progBar(name, val, pct, color) {
  return '<div class="prog">'+
    '<div class="prog-hd"><span class="prog-name">'+name+'</span><span class="prog-num">'+val+'</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+Math.min(100,Math.round(pct))+'%;background:'+color+'"></div></div>'+
    '</div>';
}

function statChip(val, lbl, color) {
  return '<div class="stat-chip">'+
    '<div class="stat-val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div>'+
    '<div class="stat-lbl">'+lbl+'</div></div>';
}

function invCard(icon, cls, val, lbl) {
  return '<div class="inv-card '+cls+'">'+
    '<div class="inv-icon">'+icon+'</div>'+
    '<div><div class="inv-val">'+val+'</div><div class="inv-lbl">'+lbl+'</div></div>'+
    '</div>';
}

function filterTable(tableId, q) {
  q = q.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(function(r){
    r.style.display = r.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
}

window.onload = function() { loadData(false); };
